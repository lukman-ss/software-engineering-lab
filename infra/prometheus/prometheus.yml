global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'lab07-observability'
    static_configs:
      - targets: ['lab07-observability:8087']

  - job_name: 'se-lab-api'
    static_configs:
      - targets: ['host.docker.internal:8080']
        labels:
          app: se-lab-api

  - job_name: 'se-lab-worker'
    static_configs:
      - targets: ['host.docker.internal:8081']
        labels:
          app: se-lab-worker
