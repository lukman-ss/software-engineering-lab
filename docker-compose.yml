version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: se-lab-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: se_lab
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./labs/05-race-condition/schema.sql:/docker-entrypoint-initdb.d/001-race-condition.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - se-lab

  redis:
    image: redis:7-alpine
    container_name: se-lab-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - se-lab

  prometheus:
    image: prom/prometheus:latest
    container_name: se-lab-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - se-lab

  grafana:
    image: grafana/grafana:10.4.0
    container_name: se-lab-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning
      - ./infra/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    networks:
      - se-lab

  jaeger:
    image: jaegertracing/all-in-one:1.57.0
    container_name: se-lab-jaeger
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    networks:
      - se-lab

  lab07-observability:
    build:
      context: .
      dockerfile: labs/07-observability/Dockerfile
    container_name: se-lab-07-observability
    ports:
      - "8087:8087"
    environment:
      - PORT=8087
      - OTEL_EXPORTER_OTLP_ENDPOINT=jaeger:4317
      - OTEL_SERVICE_NAME=lab07-observability
    depends_on:
      - jaeger
      - prometheus
    networks:
      - se-lab

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  se-lab:
    driver: bridge
